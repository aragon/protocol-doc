<text x="64.00" y="125.00" font-size="13" text-anchor="end" style="fill:#55666e">10</text>
<line x1="78.00" y1="360.00" x2="78.00" y2="365.00" stroke="#7c8a90" stroke-width="1"/>
<text x="78.00" y="385.00" font-size="13" text-anchor="middle" style="fill:#55666e">0</text>
