<text x="32.00" y="60.00" font-size="14" text-anchor="start" style="fill:#55666e">100 MYTOKEN per fill · 1 USDC/hour · 10 USDC cap</text>
<line x1="32.00" y1="86.00" x2="61.00" y2="86.00" stroke="#23745a" stroke-width="3"/>
<text x="70.00" y="91.00" font-size="13" text-anchor="start">USDC offered</text>
<line x1="250.00" y1="86.00" x2="279.00" y2="86.00" stroke="#74828a" stroke-width="2" stroke-dasharray="3 5"/>
<text x="288.00" y="91.00" font-size="13" text-anchor="start">Market value of 100 MYTOKEN: 7.8 USDC</text>
