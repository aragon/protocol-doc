<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc">
<title id="title">A growing USDC offer reaches the market cost of 100 MYTOKEN, then resets after each fill</title>
<desc id="desc">Illustrative market price: 0.078 USDC per MYTOKEN, or 7.8 USDC for 100 tokens. The offer grows by 1 USDC per hour, capped at 10. A solver fills at 8 USDC at hours 8 and 16, including 0.2 USDC for execution costs and margin. Each fill resets the offer to zero.</desc>
<style>text {font-family:DejaVu Sans,Arial,sans-serif;fill:#273740} .muted{fill:#55666e}</style>
<rect width="960" height="450" rx="12" fill="#f7f9f7"/>
